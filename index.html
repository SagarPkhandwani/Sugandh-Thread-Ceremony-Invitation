@keyframes rs{from{transform:translateX(-45%)}to{transform:translateX(45%)}}
#sh{background:linear-gradient(transparent 45%,rgba(30,6,6,.55))}
.sc{position:absolute;left:5%;right:5%;bottom:4%;opacity:0;pointer-events:none}
.pl{padding:4.6cqw 4cqw;border-radius:5cqw;text-align:center;font-size:4.2cqw;line-height:1.55;background:linear-gradient(rgba(70,14,24,.72),rgba(40,8,16,.74));backdrop-filter:blur(5px);border:1px solid var(--g);box-shadow:0 0 0 1.2cqw rgba(233,195,90,.16),0 20px 60px #0009;text-shadow:0 1px 6px #0008}

.k{color:var(--g);letter-spacing:.18em;font-size:3.6cqw}.or{color:var(--g)}
.ev{margin:2cqw 0;line-height:1.45}.ev b{display:block;color:var(--m)}
.vn{margin-top:2.4cqw;padding-top:2cqw;border-top:1px solid #e9c35a88;font-size:3.8cqw}.vn b{color:var(--m)}
.bs{display:grid;grid-template-columns:1fr 1fr;gap:1.8cqw;margin-top:2.4cqw}.bs div{border:1px solid var(--g);border-radius:3cqw;padding:1.2cqw;background:rgba(255,255,255,.1);line-height:1.3}.bs b{color:var(--m);font-size:4.6cqw;display:block}.bs small{font-size:3cqw}

.lf.r{left:50%;background-position:-50cqw -40cqh;transform-origin:right}
.tx{position:absolute;left:8%;right:8%;top:45%;padding:3cqw 0;text-align:center;font-size:4.3cqw;line-height:1.5;text-shadow:0 2px 8px #000,0 0 16px #000;background:radial-gradient(ellipse,rgba(25,8,4,.62),transparent 72%);transition:opacity .35s ease}
.tx h1{color:var(--m);font-size:9cqw;margin:1cqw 0}.tx p{margin:0}
.ht{position:absolute;bottom:5%;left:0;right:0;text-align:center;font-size:4.2cqw;text-shadow:0 2px 8px #000,0 0 14px #000;animation:fk 1.6s infinite alternate;transition:opacity .35s ease}
@keyframes fk{to{opacity:.45}}
#door.magic .tx,#door.magic .ht{opacity:0}
.mc{margin-top:2cqw;color:rgba(255,230,170,.82);font-size:2.8cqw}

<script>
/* ===== बदलने के लिए सिर्फ़ यह भाग संपादित करें (नाम व समय ऊपर के HTML में हैं) ===== */
const C={
 hall:"श्री पूज्य पंचायत घाराई हॉल", hallLoc:"क्वेटा कॉलोनी, नागपुर",
 lawn:"हैप्पी वेडिंग्स लॉन", lawnLoc:"नारा रोड, नागपुर",
 first:"2026-12-12T13:00:00+05:30", d1:"2026-12-12T13:00:00+05:30", d2:"2026-12-13T11:00:00+05:30",
 phone:"" /* WhatsApp नंबर, जैसे 919876543210 */
};
/* ============================================================================== */
const $=id=>document.getElementById(id),R=document.documentElement,N=8,cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const S=[...$("T").content.children];S.forEach(s=>{s.classList.add("sc");$("vp").append(s)});
document.querySelectorAll("[data-k]").forEach(e=>e.textContent=C[e.dataset.k]);
/* camera path over the real castle photo: focus x, focus y, zoom */
const T=[[.5,.55,1],[.5,.62,1.7],[.22,.66,1.9],[.5,.8,1.6],[.5,.38,1.5],[.78,.66,2],[.5,.92,1.5],[.5,.55,1.08]].map(([x,y,s])=>[cl(.5-x*s,1-s,0),cl(.36-y*s,1-s,0),s]);
const NT=[0,0,0,1,0,.35,1,0];let cur=0,op=0;
(function fr(t){const h=R.scrollHeight-innerHeight,p=op&&h>0?scrollY/h:0;cur+=(p-cur)*.07;
 const s=cur*(N-1),i=Math.min(s|0,N-2),f=s-i,e=f*f*(3-2*f),a=T[i],b=T[i+1],m=k=>a[k]+(b[k]-a[k])*e,ti=t/1000;
 $("cam").style.transform=`translate(${(m(0)-.004-Math.sin(ti*.5)*.004)*100}%,${(m(1)-.004-Math.cos(ti*.4)*.004)*100}%) scale(${m(2)*(1.012+Math.sin(ti*.3)*.012)})`;
 R.style.setProperty("--n",NT[i]+(NT[i+1]-NT[i])*e);
 S.forEach((el,j)=>{const d=s-j,o=cl(1-Math.abs(d)*2.2,0,1);el.style.opacity=o;el.style.visibility=o<.01?"hidden":"visible";el.style.pointerEvents=o>.6?"auto":"none";el.style.filter=`blur(${Math.abs(d)*9}px)`;el.style.transform=`translateY(${-d*50}px)`});
 requestAnimationFrame(fr)})(0);
/* countdown */
const U=["दिन","घंटे","मिनट","सेकंड"],D=n=>String(n).padStart(2,"0").replace(/\d/g,d=>"०१२३४५६७८९"[d]);
$("cd").innerHTML=U.map(u=>`<div><b>००</b><small>${u}</small></div>`).join("");
function tk(){const t=Math.max(0,new Date(C.first)-Date.now())/1000|0;[t/86400,t/3600%24,t/60%60,t%60].forEach((v,i)=>$("cd").children[i].firstChild.textContent=D(Math.floor(v)))}tk();setInterval(tk,1000);
/* links */
const mp=q=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q),f2=t=>t.toISOString().replace(/[-:]|\.\d+/g,"");
const ca=(d,t,l)=>{d=new Date(d);return"https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(t)+"&dates="+f2(d)+"/"+f2(new Date(+d+144e5))+"&location="+encodeURIComponent(l)};
$("m1").href=mp(C.hall+" "+C.hallLoc);$("m2").href=mp(C.lawn+" "+C.lawnLoc);
$("c1").href=ca(C.d1,"मेहंदी व संगीत — सुगंध परिवार",C.hall+", "+C.hallLoc);$("c2").href=ca(C.d2,"यज्ञोपवीत संस्कार व रिसेप्शन — सुगंध परिवार",C.lawn+", "+C.lawnLoc);
$("rs").href="https://wa.me/"+C.phone+"?text="+encodeURIComponent("🙏 नमस्ते! हम सपरिवार सुगंध परिवार के यज्ञोपवीत संस्कार एवं मंगल उत्सव में उपस्थित होंगे।");
function sh(){const n=$("gn").value.trim();$("sh2").href="https://wa.me/?text="+encodeURIComponent("🙏 "+(n?n+" जी, ":"")+"सुगंध परिवार आपको सपरिवार सादर आमंत्रित करता है — यज्ञोपवीत संस्कार एवं मंगल उत्सव, १२ व १३ दिसंबर २०२६, नागपुर। आमंत्रण देखें: "+location.href)}$("gn").oninput=sh;sh();
/* petals + gold dust */
const cv=$("dl"),x=cv.getContext("2d"),vp=$("vp");let W,H;const rs=()=>{W=cv.width=vp.clientWidth;H=cv.height=vp.clientHeight};rs();addEventListener("resize",rs);
const P=Array.from({length:45},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2.4+.8,v:Math.random()*.6+.25,a:Math.random()*6}));
(function d(){x.clearRect(0,0,W,H);P.forEach(p=>{p.y+=p.v;p.a+=.03;p.x+=Math.sin(p.a)*.6;if(p.y>H+8){p.y=-8;p.x=Math.random()*W}const pt=p.r>1.8;x.beginPath();x.fillStyle=pt?"rgba(255,150,170,.8)":"rgba(255,225,140,.7)";x.ellipse(p.x,p.y,pt?p.r*2.2:p.r,p.r,p.a,0,7);x.fill()});requestAnimationFrame(d)})();
/* Guest-controlled background music */
const bgm=$("bgm");bgm.volume=.28;let musicOn=false;
function setMusic(on){musicOn=on;const b=$("snd");b.classList.toggle("on",on);b.setAttribute("aria-pressed",String(on));b.setAttribute("aria-label",on?"संगीत रोकें":"संगीत चलाएँ");b.title=on?"संगीत रोकें":"संगीत चलाएँ"}
async function snd(){if(musicOn){bgm.pause();setMusic(false);return}try{await bgm.play();setMusic(true)}catch(e){setMusic(false)}}
$("snd").onclick=snd;/* door opens, camera moves in */
R.style.overflow="hidden";
$("door").onclick=()=>{const d=$("door");d.classList.add("magic");setTimeout(()=>{op=1;R.style.overflow=""},380);setTimeout(()=>d.remove(),1150)};
